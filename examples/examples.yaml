# Ninja Merger の設定例。
# 現行仕様全体は docs/configuration.md と docs/operations.md を参照してください。

models:
  # フルモデル出力の例です。post_operation の既定値は add なので、
  # マージ結果そのもので対象レイヤーを置き換える場合は none を明示します。
  - name: mix-full-model
    target: path/to/target-model
    left: path/to/base-model
    right: path/to/tuned-model
    operation: mix
    velocity: 0.35
    post_operation: none
    exclude_layers:
      - model.embed_tokens
      - lm_head

  # 疎ベクトル出力の例です。フルモデルディレクトリではなく、
  # <out_dir>/vector/delta-vector.difftensors を書き出します。
  - name: delta-vector
    target: null
    left: path/to/base-model
    right: path/to/tuned-model
    operation: sub
    post_operation: none
    unmatch_size_layer_op: skip

  # 保存済みの疎ベクトルを明示的な対象モデルへ適用する例です。
  - name: apply-vector
    target: path/to/target-model
    left: merged_models/vector/delta-vector.difftensors
    right: none
    operation: none
    post_operation: add
